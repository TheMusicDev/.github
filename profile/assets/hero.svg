<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="1600" height="480" role="img" aria-label="The Music Dev — Accessible technology for independent music">
  <style>
    .bar { fill: #fac775; transform-origin: center 320px; animation: eq 2.4s ease-in-out infinite; }
    @keyframes eq {
      0%, 100% { transform: scaleY(1); }
      50%      { transform: scaleY(var(--h, 1.6)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bar { animation: none; }
      .shine { animation: none; opacity: 0; }
    }
    /* gold sheen sweeping across the title */
    .shine {
      animation: sweep 7s ease-in-out infinite;
      transform: translateX(-480px);
    }
    @keyframes sweep {
      0%       { transform: translateX(-480px); }
      30%, 70% { transform: translateX(480px); }
      100%     { transform: translateX(-480px); }
    }
  </style>
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="480" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#fac775" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fac775" stop-opacity="0.9"/>
      <stop offset="1"   stop-color="#fac775" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="480" fill="#0f6b57"/>
  <rect width="1600" height="480" fill="#145244" opacity="0.35"/>

  <!-- equalizer: baseline at y=320, bars grow upward -->
  <g>
    <rect class="bar" x="80"  y="212" width="10" height="108" style="--h:1.35"/>
    <rect class="bar" x="108" y="240" width="10" height="80"  style="--h:1.9"  />
    <rect class="bar" x="136" y="188" width="10" height="132" style="--h:1.25" />
    <rect class="bar" x="164" y="256" width="10" height="64"  style="--h:2.1"  />
