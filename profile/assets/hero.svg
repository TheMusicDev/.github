    <rect class="bar" x="1452" y="260" width="10" height="60"  style="--h:2.3" />
    <rect class="bar" x="1480" y="222" width="10" height="98"  style="--h:1.5" />
  </g>

  <text x="800" y="120" text-anchor="middle"
        font-family="Nunito Sans, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="900" font-size="76" letter-spacing="2" fill="#ffffff">The / Music / Dev</text>
  <clipPath id="titleClip"><text x="800" y="120" text-anchor="middle"
        font-family="Nunito Sans, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="900" font-size="76" letter-spacing="2">The / Music / Dev</text></clipPath>
  <g clip-path="url(#titleClip)">
    <rect class="shine" x="-240" y="50" width="480" height="100" fill="url(#sheen)"/>
  </g>

  <text x="800" y="392" text-anchor="middle"
        font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="600" font-size="27" letter-spacing="0.5" fill="#fac775">Accessible technology for independent music</text>
</svg>