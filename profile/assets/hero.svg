    <rect class="bar" x="500" y="198" width="10" height="122" style="--h:1.4"  />
    <rect class="bar" x="528" y="234" width="10" height="86"  style="--h:1.8"  />
    <rect class="bar" x="556" y="176" width="10" height="144" style="--h:1.15" />
