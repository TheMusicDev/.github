    <rect class="bar" x="220" y="236" width="10" height="84"  style="--h:1.75" />
    <rect class="bar" x="248" y="196" width="10" height="124" style="--h:1.4"  />
    <rect class="bar" x="276" y="262" width="10" height="58"  style="--h:2.3"  />
